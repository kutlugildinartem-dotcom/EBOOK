name: Publish Leaf
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: corepack enable
      - run: corepack prepare pnpm@11.25.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm prepare:assets
      - run: node tests/language-engine.test.mjs
      - run: node tests/translation-selection.test.mjs
      - run: node tests/reader-interactions.test.mjs
      - run: node tests/import-book.test.mjs
      - run: pnpm build:static
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist-static
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
